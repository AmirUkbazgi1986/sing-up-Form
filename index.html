<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap"
      rel="stylesheet"
    />

    <title>Sign in Form</title>
    <link rel="stylesheet" href="index.css" />

    <script
      src="https://kit.fontawesome.com/efff12fc33.js"
      crossorigin="anonymous"
    ></script>

    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="left-box">
        <div class="odin-box">
          <img src="idkh09PaW6_1746216591179.svg" alt="oding pic" />
          <h1>ODIN</h1>
        </div>
      </div>
      <div class="right-box">
        <div class="top-box">
          <p>
            This is not real online service! You know you need something<br />
            like this in your life to help you realize your deep dreams.<br />
            Sign up now to get started
          </p>
          <p>You know you want to</p>
        </div>
        <div class="form">
          <h3>Let's do this!</h3>
          <div class="form-container">
            <div>
              <label for="firstName">FIRST NAME</label>
              <input type="text" placeholder="Thor" name="firstName" />
            </div>
            <div>
              <label for="LastName">LAST NAME</label>
              <input type="text" placeholder="Odinson" name="LastName" />
            </div>
            <div>
              <label for="Email">EMAIL</label>
              <input type="email" name="Email" required />
            </div>
            <div>
              <label for="PhoneNumber">PHONE NUMBER</label>
              <input type="number" name="PhoneNumber" />
            </div>
            <div>
              <label for="password">PASSWORD</label>
              <input type="password" name="password" required />
            </div>
            <div>
              <label for="confirm password">CONFIRM PASSWORD</label>
              <input type="password" name="confirm password" required />
            </div>
          </div>
        </div>
        <div class="bottom-box">
          <div class="footer">
            <button>Create Account</button>
            <p>Already have an account ? <span>Log in</span></p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
